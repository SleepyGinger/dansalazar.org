<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f6f3ec"><title>Mila · God mode</title><link rel="stylesheet" href="../styles.css?v=2"><link rel="stylesheet" href="admin.css?v=3"><script type="module" src="admin.js?v=4"></script></head><body>
<header><a class="back" href="../">← Family voting page</a><p class="eyebrow">Mila’s Love Book · Private admin</p><h1>God mode</h1><p class="intro">See who chose each style.</p></header><main>
<section id="sign-in-panel" class="gate"><h2>Your eyes only</h2><p>Sign in with Dan’s Google account to see individual votes.</p><button id="sign-in" class="primary" type="button">Sign in with Google</button><p id="auth-message" role="status" aria-live="polite">Checking sign-in…</p><button id="retry-access" type="button" hidden>Try again</button><button id="switch-account" type="button" hidden>Switch account</button></section>
<section id="admin-panel" hidden><div class="poll-tabs" role="group" aria-label="Voting round"><button type="button" data-poll="final" aria-pressed="true">Final round</button><button type="button" data-poll="first" aria-pressed="false">Round one</button></div><div class="admin-toolbar"><div><strong id="summary"></strong><p id="signed-in"></p></div><div class="actions"><button id="refresh" type="button">Refresh</button><button id="sign-out" type="button">Sign out</button></div></div><div class="tabs" role="group" aria-label="View votes"><button type="button" data-view="people" aria-pressed="false">By person</button><button type="button" data-view="styles" aria-pressed="true">By style</button></div><p id="load-status" role="status" aria-live="polite"></p><p id="rank-note" class="rank-note">Most votes first. Each person chooses one final favorite.</p><div id="votes"></div></section>
<noscript><p>Please enable JavaScript to sign in and view votes.</p></noscript></main></body></html>
